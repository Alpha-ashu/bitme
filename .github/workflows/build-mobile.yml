name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: ANDROID APK BUILD (Produces installable .apk)
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Build Web Application
        run: npm --prefix frontend run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/AnacondaPark-v1.0-debug.apk
          ls -la output/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AnacondaPark-Android-APK
          path: output/AnacondaPark-v1.0-debug.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: iOS IPA BUILD (Produces downloadable .ipa)
  # ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Build Web Application
        run: npm --prefix frontend run build

      - name: Initialize & Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build Xcode Archive (Unsigned / Ad-Hoc)
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .IPA file
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr ../../../output-ios/AnacondaPark-v1.0-unsigned.ipa Payload
          ls -la ../../../output-ios/

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnacondaPark-iOS-IPA
          path: output-ios/AnacondaPark-v1.0-unsigned.ipa
          retention-days: 30

